name: Publicar site no GitHub Pages
 
on:
  # Roda a cada push na branch main
  push:
    branches: [main]
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:
 
# Permissões mínimas necessárias para publicar no Pages
permissions:
  contents: read
  pages: write
  id-token: write
 
# Evita duas publicações ao mesmo tempo
concurrency:
  group: pages
  cancel-in-progress: true
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
 
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
 
      - name: Configurar o Pages
        uses: actions/configure-pages@v5
 
      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
 
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
 
